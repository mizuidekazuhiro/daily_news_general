name: India Steel Intelligence Backfill v3

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without Intelligence-row writes"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      lookback_days:
        description: "Historical lookback days"
        required: true
        default: "180"
        type: string
      min_score:
        description: "Minimum importance score"
        required: true
        default: "4"
        type: string
      batch_size:
        description: "Articles per GPT batch"
        required: true
        default: "20"
        type: string

jobs:
  backfill:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[india-steel-backfill-v3-dry]') ||
      contains(github.event.head_commit.message, '[india-steel-backfill-v3-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INTELLIGENCE_NIKKEI_DB_ID: "354dec27-c9aa-803e-bef1-f446abac9b2e"
      INTELLIGENCE_GENERAL_DB_ID: "2eddec27-c9aa-8022-9699-c36467fd9477"
      INDIA_STEEL_BACKFILL_MODEL: "gpt-5-mini"
      INDIA_STEEL_BACKFILL_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.lookback_days || '180' }}
      INDIA_STEEL_BACKFILL_MIN_SCORE: ${{ github.event_name == 'workflow_dispatch' && inputs.min_score || '4' }}
      INDIA_STEEL_BACKFILL_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '20' }}
      INDIA_STEEL_BACKFILL_MAX_BATCHES: ${{ contains(github.event.head_commit.message, '[india-steel-backfill-v3-dry]') && '1' || '50' }}
      INDIA_STEEL_BACKFILL_MAX_EXISTING: "500"
      INDIA_STEEL_BACKFILL_BODY_CHARS: "3500"
      INDIA_STEEL_BACKFILL_MAX_OUTPUT_TOKENS: "10000"
      INDIA_STEEL_BACKFILL_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || contains(github.event.head_commit.message, '[india-steel-backfill-v3-dry]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backfill runner
        run: python -m py_compile scripts/setup_intelligence_database.py scripts/run_india_steel_backfill.py scripts/run_india_steel_backfill_v2.py scripts/run_india_steel_backfill_v3.py src/intelligence_pipeline.py

      - name: Resolve Intelligence database
        run: |
          db_id=$(python scripts/setup_intelligence_database.py)
          echo "NOTION_INTELLIGENCE_DB_ID=${db_id}" >> "$GITHUB_ENV"
          echo "Resolved Intelligence DB: ${db_id}"

      - name: Run India steel backfill v3
        run: python scripts/run_india_steel_backfill_v3.py

      - name: Upload backfill logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-steel-backfill-v3-logs
          path: |
            logs/india_steel_backfill*.json
