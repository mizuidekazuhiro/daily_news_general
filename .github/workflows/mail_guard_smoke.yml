name: Mail Delivery Guard Smoke Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mail_guard_smoke.yml'
  workflow_dispatch:

jobs:
  verify-sent-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check today's already-sent main news with standard IMAP
        id: guard
        env:
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_USER: ${{ secrets.MAIL_FROM }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: python scripts/check_mail_delivery_guard.py --kind main
      - name: Assert sent mail was detected
        run: |
          echo "guard_skip=${{ steps.guard.outputs.skip }}"
          test "${{ steps.guard.outputs.skip }}" = "true"
