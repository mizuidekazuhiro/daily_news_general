name: Nikkei Morning Paper

on:
  workflow_dispatch:
  schedule:
    # JST 06:10 / 06:30 / 06:50
    - cron: "10,30,50 21 * * *"

jobs:
  nikkei-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARTICLE_DB_ID: ${{ secrets.NOTION_ARTICLE_DB_ID }}
      NIKKEI_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLE_DB_ID }}
      NIKKEI_SESSION_STATE_JSON: ${{ secrets.NIKKEI_SESSION_STATE_JSON }}

      NIKKEI_MORNING_URL: https://www.nikkei.com/paper/
      NIKKEI_USE_DIRECT_ISSUE_URL: "true"
      NIKKEI_ALLOW_DIRECT_FALLBACK: "false"
      NIKKEI_PAPER_URL_TEMPLATE: "https://www.nikkei.com/paper/{edition}/?b={date}&d=0"
      NIKKEI_EDITION: morning
      NIKKEI_TARGET_DATE: auto
      NIKKEI_REQUIRE_TODAY: "true"
      NIKKEI_ALLOW_EMPTY_ISSUE: "false"

      NIKKEI_MAX_ARTICLES_TO_FETCH: "0"
      NIKKEI_FETCH_SLEEP_SECONDS: "1.5"

      NIKKEI_EXCLUDE_TITLE_REGEX: "^(春秋|大機小機|交遊抄|私の履歴書|あすへの話題)$|人事|おくやみ|訃報|叙勲|スポーツ|文化|生活|読書|詩歌|囲碁|将棋"
      NIKKEI_EXCLUDE_BODY_REGEX: "人事記事をもっと見る"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore Nikkei session
        run: |
          mkdir -p .storage
          python - <<'PY'
          import os
          from pathlib import Path

          raw = os.environ.get("NIKKEI_SESSION_STATE_JSON", "").strip()
          if not raw:
              raise RuntimeError("NIKKEI_SESSION_STATE_JSON is missing")

          Path(".storage/nikkei_storage_state.json").write_text(raw, encoding="utf-8")
          print("restored .storage/nikkei_storage_state.json")
          PY

      - name: Run Nikkei morning pipeline
        run: |
          python scripts/run_nikkei_paper_pipeline.py
