name: Nikkei Morning Paper

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Target date in JST. Use auto or YYYYMMDD."
        required: true
        default: "auto"
        type: string
      max_articles:
        description: "Max articles to fetch. Use 0 for all."
        required: true
        default: "0"
        type: string
      skip_existing:
        description: "Skip articles already saved in Notion"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      pre_title_filter:
        description: "Enable pre title filtering"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      block_heavy_resources:
        description: "Block image/media/font/stylesheet in Playwright"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      enable_scoring:
        description: "Run Rules DB scoring after fetch"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      run_final_report:
        description: "Run final report generation"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      report_top_rank:
        description: "Number of top importance articles for GPT/report"
        required: true
        default: "10"
        type: string
      article_gpt_min_importance_score:
        description: "Minimum importance score for article GPT enrichment. Articles with score <= this value are skipped."
        required: true
        default: "3"
        type: string
      enable_article_gpt_enrichment:
        description: "Run article-level GPT enrichment"
        required: true
        default: "false"
        type: choice
        options: ["true","false"]
      enable_final_report_gpt:
        description: "Run final report GPT synthesis"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      save_final_report_to_notion:
        description: "Save final report to Notion Daily News DB"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      final_report_article_text_chars:
        description: "Max text excerpt characters per article for final report GPT"
        required: true
        default: "1800"
        type: string
      send_final_report_mail:
        description: "Send final report email"
        required: true
        default: "true"
        type: choice
        options: ["true","false"]
      allow_fallback_final_report_mail:
        description: "Allow sending fallback final report email"
        required: true
        default: "false"
        type: choice
        options: ["true","false"]
  schedule:
    - cron: "10,30,50 21 * * *"

jobs:
  nikkei-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_ARTICLE_DB_ID: ${{ secrets.NOTION_ARTICLE_DB_ID }}
      NIKKEI_ARTICLES_DB_ID: ${{ secrets.NOTION_ARTICLE_DB_ID }}
      NIKKEI_SESSION_STATE_JSON: ${{ secrets.NIKKEI_SESSION_STATE_JSON }}
      NOTION_RULES_DB_ID: ${{ secrets.NOTION_RULES_DB_ID }}
      NIKKEI_EDITION: morning
      NIKKEI_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || 'auto' }}
      NIKKEI_MAX_ARTICLES_TO_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.max_articles || '0' }}
      NIKKEI_SKIP_EXISTING_NOTION_URLS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_existing || 'true' }}
      NIKKEI_ENABLE_PRE_TITLE_FILTER: ${{ github.event_name == 'workflow_dispatch' && inputs.pre_title_filter || 'true' }}
      NIKKEI_BLOCK_HEAVY_RESOURCES: ${{ github.event_name == 'workflow_dispatch' && inputs.block_heavy_resources || 'true' }}
      NIKKEI_ENABLE_SCORING: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_scoring || 'true' }}
      NIKKEI_ENABLE_NOTION_SCORE_UPDATE: "true"
      NIKKEI_MORNING_URL: https://www.nikkei.com/paper/
      NIKKEI_USE_DIRECT_ISSUE_URL: "true"
      NIKKEI_ALLOW_DIRECT_FALLBACK: "false"
      NIKKEI_PAPER_URL_TEMPLATE: "https://www.nikkei.com/paper/{edition}/?b={date}&d=0"
      NIKKEI_REQUIRE_TODAY: "true"
      NIKKEI_ALLOW_EMPTY_ISSUE: "false"
      NIKKEI_PRE_EXCLUDE_SHORT_TITLES: "true"
      NIKKEI_PRE_EXCLUDE_HR_LIKE_TITLES: "true"
      NIKKEI_ARTICLE_GOTO_TIMEOUT_MS: "25000"
      NIKKEI_ARTICLE_WAIT_AFTER_LOAD_MS: "800"
      NIKKEI_ARTICLE_EXTRACT_RETRIES: "3"
      NIKKEI_MIN_ARTICLE_TEXT_LENGTH: "120"
      NIKKEI_RETRY_WITHOUT_RESOURCE_BLOCK_ON_FAILURE: "true"
      NIKKEI_ALLOW_EMPTY_FETCH: "false"
      NIKKEI_RULES_SOURCE: "notion"
      NIKKEI_RULES_FILTER_RULE_TYPES: "country,sector,importance"
      NIKKEI_MIN_IMPORTANCE_SCORE_FOR_REPORT: "5"
      NIKKEI_REPORT_SELECTION_MODE: "top_importance_rank"
      NIKKEI_REPORT_TOP_IMPORTANCE_RANK: ${{ github.event_name == 'workflow_dispatch' && inputs.report_top_rank || '5' }}
      NIKKEI_REPORT_INCLUDE_TIES: "false"
      NIKKEI_ARTICLE_GPT_MIN_IMPORTANCE_SCORE: ${{ github.event_name == 'workflow_dispatch' && inputs.article_gpt_min_importance_score || '3' }}
      NIKKEI_FINAL_REPORT_ARTICLE_TEXT_CHARS: ${{ github.event_name == 'workflow_dispatch' && inputs.final_report_article_text_chars || '0' }}
      NIKKEI_FINAL_REPORT_MAX_OUTPUT_TOKENS: "8000"
      NIKKEI_SEND_FINAL_REPORT_MAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.send_final_report_mail || 'true' }}
      NIKKEI_ALLOW_FALLBACK_FINAL_REPORT_MAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_fallback_final_report_mail || 'true' }}
      NIKKEI_ALLOW_DEFAULT_RULES_DB_FALLBACK: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NIKKEI_ENABLE_ARTICLE_GPT_ENRICHMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_article_gpt_enrichment || 'false' }}
      NIKKEI_ENABLE_FINAL_REPORT_GPT: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_final_report_gpt || 'true' }}
      NIKKEI_SAVE_FINAL_REPORT_TO_NOTION: ${{ github.event_name == 'workflow_dispatch' && inputs.save_final_report_to_notion || 'true' }}
      NOTION_DAILY_NEWS_DB_ID: ${{ secrets.NOTION_DAILY_NEWS_DB_ID }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      MAIL_CC: ${{ secrets.MAIL_CC }}
      MAIL_BCC: ${{ secrets.MAIL_BCC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: |
          mkdir -p .storage
          python - <<'P'
          import os
          from pathlib import Path
          Path('.storage/nikkei_storage_state.json').write_text(os.environ['NIKKEI_SESSION_STATE_JSON'],encoding='utf-8')
          P
      - run: python scripts/run_nikkei_paper_pipeline.py
      - name: Check final report skip marker
        id: fr_skip
        run: |
          python - <<'P'
          import json
          from pathlib import Path
          p = Path('logs/nikkei_paper_pipeline_skip.json')
          skip = False
          if p.exists():
            try:
              skip = bool(json.loads(p.read_text(encoding='utf-8')).get('skip_final_report'))
            except Exception:
              skip = True
          with open(Path('${GITHUB_OUTPUT}'), 'a', encoding='utf-8') as f:
            f.write(f"skip={str(skip).lower()}\n")
          P
      - run: python scripts/run_nikkei_final_report.py
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.run_final_report == 'true') && steps.fr_skip.outputs.skip != 'true' }}

      - name: Upload Nikkei debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikkei-debug-logs
          path: |
            logs/**/*.json
            logs/**/*.txt
            logs/**/*.html
            logs/**/*.png
