name: Intelligence Pipeline Tests

on:
  pull_request:
    paths:
      - 'src/intelligence_pipeline.py'
      - 'src/intelligence_safety.py'
      - 'src/intelligence_policy.py'
      - 'src/intelligence_rules.py'
      - 'src/intelligence_processing.py'
      - 'scripts/run_intelligence_pipeline.py'
      - 'scripts/run_india_steel_backfill_v3.py'
      - 'scripts/run_regional_steel_backfill.py'
      - 'tests/test_intelligence_pipeline.py'
      - 'tests/test_intelligence_safety.py'
      - 'tests/test_intelligence_rules.py'
      - 'tests/test_intelligence_policy.py'
      - 'tests/test_intelligence_policy_headline_guard.py'
      - 'tests/test_intelligence_final_quality.py'
      - 'tests/test_intelligence_processing.py'
      - 'tests/test_regional_steel_backfill.py'
      - '.github/workflows/intelligence.yml'
      - '.github/workflows/india_steel_backfill_v3.yml'
      - '.github/workflows/regional_steel_backfill.yml'
      - '.github/workflows/intelligence_tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/intelligence_pipeline.py'
      - 'src/intelligence_safety.py'
      - 'src/intelligence_policy.py'
      - 'src/intelligence_rules.py'
      - 'src/intelligence_processing.py'
      - 'scripts/run_intelligence_pipeline.py'
      - 'scripts/run_india_steel_backfill_v3.py'
      - 'scripts/run_regional_steel_backfill.py'
      - 'tests/test_intelligence_pipeline.py'
      - 'tests/test_intelligence_safety.py'
      - 'tests/test_intelligence_rules.py'
      - 'tests/test_intelligence_policy.py'
      - 'tests/test_intelligence_policy_headline_guard.py'
      - 'tests/test_intelligence_final_quality.py'
      - 'tests/test_intelligence_processing.py'
      - 'tests/test_regional_steel_backfill.py'
      - '.github/workflows/intelligence.yml'
      - '.github/workflows/india_steel_backfill_v3.yml'
      - '.github/workflows/regional_steel_backfill.yml'
      - '.github/workflows/intelligence_tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Compile Intelligence modules
        run: python -m py_compile src/intelligence_pipeline.py src/intelligence_safety.py src/intelligence_policy.py src/intelligence_rules.py src/intelligence_processing.py scripts/run_intelligence_pipeline.py scripts/run_india_steel_backfill_v3.py scripts/run_regional_steel_backfill.py

      - name: Validate Intelligence workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in [
              '.github/workflows/intelligence.yml',
              '.github/workflows/india_steel_backfill_v3.yml',
              '.github/workflows/regional_steel_backfill.yml',
          ]:
              yaml.safe_load(Path(path).read_text(encoding='utf-8'))
              print(f'validated: {path}')
          PY

      - name: Run Intelligence unit tests
        run: pytest -q tests/test_intelligence_pipeline.py tests/test_intelligence_safety.py tests/test_intelligence_rules.py tests/test_intelligence_policy.py tests/test_intelligence_policy_headline_guard.py tests/test_intelligence_final_quality.py tests/test_intelligence_processing.py tests/test_regional_steel_backfill.py
