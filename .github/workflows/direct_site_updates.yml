name: Direct Site Diagnostics (manual)

# Automatic specialist-paper delivery is owned exclusively by
# special_news_delivery.yml. This workflow only verifies direct acquisition.
on:
  workflow_dispatch:

concurrency:
  group: direct-site-diagnostics-manual
  cancel-in-progress: false

jobs:
  direct-site-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run direct acquisition diagnostics
        env:
          NOTION_DIRECT_SITES_ENABLED: "true"
          DIRECT_SITE_ALLOW_LOCAL_CONFIG_FALLBACK: "false"
          DIRECT_SITE_DIAGNOSTIC_ONLY: "true"
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DIRECT_SITES_DB_ID: ${{ secrets.NOTION_DIRECT_SITES_DB_ID }}
        run: python direct_site_updates.py
