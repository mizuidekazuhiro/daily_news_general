name: News Reliability Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/news_reliability_tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/news_reliability_tests.yml'

permissions:
  contents: read

concurrency:
  group: news-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml jsonschema
      - name: Archive reproducible source snapshot
        run: git archive --format=tar HEAD > source-snapshot.tar
      - name: Compile modules
        run: python -m compileall -q src scripts tests
      - name: Run regression tests without production credentials
        run: python -m pytest -q tests/test_intelligence*.py tests/test_setup_intelligence_database.py tests/test_regional_steel_backfill.py tests/test_india_backfill_scope.py tests/test_general_report_modules.py --junitxml=regression-results.xml
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-reliability-evidence
          path: |
            regression-results.xml
            source-snapshot.tar
          retention-days: 7
