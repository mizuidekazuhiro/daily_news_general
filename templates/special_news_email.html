<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>専門紙ニュース</title>
  </head>
  <body style="margin:0;padding:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;color:#111827;-webkit-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f3f4f6;">
      <tr>
        <td align="center" style="padding:20px 10px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:680px;background:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
            <tr>
              <td style="padding:22px 22px 18px 22px;">
                <div style="font-size:12px;line-height:1.4;color:#6b7280;letter-spacing:.04em;margin-bottom:5px;">STEEL INDUSTRY NEWS</div>
                <h1 style="margin:0;font-size:21px;line-height:1.35;color:#111827;font-weight:700;">専門紙ニュース</h1>
                <div style="margin-top:12px;padding:10px 12px;background:#f8fafc;border-radius:8px;font-size:13px;line-height:1.6;color:#4b5563;">
                  <span style="display:inline-block;margin-right:16px;">対象日 <strong style="color:#111827;">$target_date</strong></span>
                  <span style="display:inline-block;">新着 <strong style="color:#111827;font-size:15px;">$total_items件</strong></span>
                </div>

                <div style="margin-top:18px;">
                  $media_sections
                </div>

                <div style="border-top:1px solid #e5e7eb;margin-top:20px;padding-top:13px;font-size:11px;line-height:1.6;color:#6b7280;">
                  公式サイトを主系、補完フィードを副系として新着記事を自動収集し、重複・送信済み記事を除外しています。<br>
                  本メールは自動配信です。記事本文は各リンク先でご確認ください。
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
