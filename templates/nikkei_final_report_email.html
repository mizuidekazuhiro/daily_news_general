<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; font-family: 'Meiryo UI', 'Meiryo', sans-serif; line-height: 1.75; color: #111; padding: 18px 10px; max-width: 100%; }
    p, li, div { overflow-wrap: anywhere; word-break: break-word; }
    a { color: #0645d2; text-decoration: underline; }
    .container { max-width: 860px; width: 100%; margin: 0 auto; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 22px; }
    .section-card { margin: 0 0 18px; padding: 16px; border: 1px solid #ddd; border-radius: 10px; background: #fff; }
    .section-title { margin: 0 0 12px; font-size: 18px; color: #111; }
    .article-card { padding: 14px; border: 1px solid #ddd; border-radius: 10px; margin: 12px 0; background: #fff; }
    .article-title { font-size: 16px; font-weight: 700; color: #111; }
    .article-index { color: #555; margin-right: 2px; }
    .article-body { margin-top: 10px; }
    .paragraph-block { margin-top: 10px; padding-top: 10px; border-top: 1px solid #e5e5e5; }
    .paragraph-head { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 5px; }
    .paragraph-body { color: #222; white-space: pre-line; padding-left: 1.2em; }
    .signal-list, .dot-list, .watch-list, .compact-list { margin: 0; padding-left: 1.3em; }
    .signal-item { margin: 12px 0; padding-top: 10px; border-top: 1px solid #e5e5e5; }
    .signal-item:first-child { border-top: 0; padding-top: 0; }
    .signal-title { font-size: 13px; font-weight: 700; color: #111; }
    .signal-body { color: #222; padding-left: 1.2em; }
    .dot-list li, .watch-item, .compact-list li { margin: 6px 0; }
    .notion-link { font-size: 12px; color: #0645d2; margin-left: 4px; }
    .lead { margin: 0 0 8px; white-space: pre-line; }
    .muted { color: #666; font-size: 12px; }
    .source-text-block { background: #fafafa; }
    .source-text { color: #666; font-size: 12px; line-height: 1.7; white-space: pre-line; padding-left: 1.2em; }
    @media (max-width: 640px) { body { padding: 8px; } .container { padding: 14px; border-radius: 10px; } .section-card { padding: 12px; } }
  </style>
</head>
<body>
  <div class="container">
    <section class="section-card">
      <h3 class="section-title">■ 今日の結論</h3>
      <div class="paragraph-body">${today_key_message}</div>
      ${executive_summary_block}
    </section>

    <section class="section-card">
      <h3 class="section-title">■ 注目すべき変化</h3>
      <div class="signal-list">${brief_items}</div>
    </section>

    <section class="section-card">
      <h3 class="section-title">■ 重要記事</h3>
      ${article_items}
    </section>

    ${watchlist_section}

    <section class="section-card">
      <h3 class="section-title">■ 取得結果</h3>
      <p class="muted">取得記事数：${all_article_count}件</p>
      ${article_category_summary}
      <p class="muted">全記事の保存先・本文は各記事のNotionリンク、またはNotionの記事DBで確認。</p>
    </section>
  </div>
</body>
</html>
