<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Meiryo UI','Meiryo',sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.7;
      color: #222;
    }
    section {
      margin: 18px 0;
    }
    h3 {
      margin-bottom: 8px;
    }
    p {
      white-space: pre-line;
    }
    ul {
      padding-left: 18px;
    }
    .article-links {
      font-size: 12px;
      line-height: 1.45;
      color: #777;
    }
    .article-links li {
      margin: 3px 0;
    }
    .article-links a {
      color: #777;
      text-decoration: none;
    }
    .article-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <section>
    <h3>本日のサマリー</h3>
    <p>${today_key_message}</p>
  </section>

  <section>
    <h3>全体ブリーフ</h3>
    <p>${executive_summary}</p>
  </section>

  <section>
    <h3>取得記事一覧</h3>
    <ul class="article-links">${reference_links}</ul>
  </section>
</body>
</html>
