<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Meiryo UI','Meiryo',sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.7;
      color: #222;
    }
    section {
      margin: 18px 0;
    }
    h3 {
      margin-bottom: 8px;
    }
    p {
      white-space: pre-line;
    }
    .top-article {
      margin: 18px 0 24px;
    }
    .top-article-title {
      font-size: 15px;
      font-weight: 700;
    }
    .top-article-title a {
      color: #333;
      text-decoration: none;
    }
    .top-article-title a:hover {
      text-decoration: underline;
    }
    .top-article-summary {
      margin-top: 6px;
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      white-space: pre-line;
    }
    .top-article-body {
      margin-top: 8px;
      font-size: 11px;
      color: #888;
      line-height: 1.6;
      white-space: pre-line;
    }
    ul {
      padding-left: 18px;
    }
    .article-links {
      font-size: 12px;
      line-height: 1.45;
      color: #777;
    }
    .article-links li {
      margin: 3px 0;
    }
    .article-links a {
      color: #777;
      text-decoration: none;
    }
    .article-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <section>
    <h3>全体ブリーフ</h3>
    <p>${executive_summary}</p>
  </section>

  <section>
    <h3>トップ5記事本文</h3>
    <div class="top-article-list">${top_article_items}</div>
  </section>

  <section>
    <h3>取得記事一覧</h3>
    <ul class="article-links">${reference_links}</ul>
  </section>
</body>
</html>
