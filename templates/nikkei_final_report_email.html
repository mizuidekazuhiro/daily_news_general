<!doctype html><html><head><meta charset="utf-8"><style>
body{font-family:'Meiryo UI','Meiryo',sans-serif;max-width:860px;margin:0 auto;padding:16px;line-height:1.65;color:#222}
section{margin:14px 0}p{white-space:pre-line}ul{padding-left:20px}
.article-body{font-size:13px;color:#555;white-space:pre-wrap;background:#fafafa;border-left:3px solid #ddd;padding:10px}
.article-links{font-size:12px;color:#777;line-height:1.45}
.article-links a{text-decoration:none;color:#777}.article-links a:hover{text-decoration:underline}
</style></head><body>
<h2>${report_title}</h2>
<div>生成日時: ${generated_at} / 対象日: ${target_date} / 対象記事数: ${article_count}</div>
<section><h3>全体ブリーフ</h3><p>${executive_summary}</p></section>
<section><h3>横断的な業務示唆</h3><p>${cross_article_implications}</p></section>
<section><h3>優先確認事項</h3><ul>${priority_watch_items}</ul></section>
<section><h3>トップ記事5本</h3><ul>${article_items}</ul></section>
<section><h3>取得記事一覧</h3><ul class="article-links">${reference_links}</ul></section>
</body></html>
